name: Verify Eris sources

on:
  push:
    branches: [master, master-lua5.3, master-lua5.4]
    tags: ['oc-eris-*']
  pull_request:
    branches: [master, master-lua5.3, master-lua5.4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eris-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libreadline-dev
      - name: Build Eris and bundled Lua
        run: make linux
      - name: Run Eris persistence tests
        run: make test

  release:
    name: Publish source release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/oc-eris-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create checksummed source archive
        run: |
          mkdir release
          git archive --format=tar.gz --prefix=OC-Eris/ "$GITHUB_SHA" > release/OC-Eris-Source.tar.gz
          (cd release && sha256sum OC-Eris-Source.tar.gz > OC-Eris-Source-SHA256SUMS.txt)
      - name: Publish source release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"OC-Eris source $RELEASE_TAG\",\"generate_release_notes\":true}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases")"
          upload_url="$(printf '%s' "$release_json" | jq -r '.upload_url' | sed 's/{?name,label}//')"
          test -n "$upload_url" && test "$upload_url" != null
          for asset in release/OC-Eris-Source.tar.gz release/OC-Eris-Source-SHA256SUMS.txt; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" \
              "$upload_url?name=$(basename "$asset")" >/dev/null
          done
